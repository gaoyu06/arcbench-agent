[project]
name = "arcbench-agent"
version = "1.0.0"
description = "Coding agent that turns ArcBench requirements into a tested React + Express + SQLite web app"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["openai==3.13.0", "pyyaml==6.0.3"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/template"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
mypy_path = "src"
files = ["src"]
exclude = ["^tests/", "^src/template/"]
